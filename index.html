      function shouldSuppress(val) {
        if (!val) return false;

        } catch (e) { }
        str = str.toLowerCase();
        return str.indexOf('websocket') !== -1 || str.indexOf('vite') !== -1 || str.indexOf('closed without opened') !== -1;
      }
      window.addEventListener('unhandledrejection', function (e) {
        if (e && (shouldSuppress(e.reason) || shouldSuppress(e.detail))) {
          e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          return false;
        }
      }, true);
      window.addEventListener('error', function (e) {
        if (e && (shouldSuppress(e.message) || shouldSuppress(e.error))) {
          e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          return false;
        }
      }, true);
