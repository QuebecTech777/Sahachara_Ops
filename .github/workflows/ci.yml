name: "Continuous Integration & Test Verification"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build, Lint & Automated Verification Suites
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://highflyer@localhost:5432/sahachara_ops_test_db
      TEST_DATABASE_URL: postgresql://highflyer@localhost:5432/sahachara_ops_test_db

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: highflyer
          POSTGRES_DB: sahachara_ops_test_db
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies (Strict Lockfile)
        run: |
          npm ci

      - name: Prisma Client Generation
        run: |
          npx prisma generate

      - name: Prisma Schema Validation
        run: |
          npx prisma validate

      - name: TypeScript Type Checking (Lint)
        run: |
          npm run lint

      - name: Release Source Manifest Integrity (SHA-256)
        run: |
          shasum -a 256 -c RELEASE_SOURCE_MANIFEST_SHA256.txt

      - name: Dependency Vulnerability Audit
        # picomatch <=4.0.7 (GHSA-fc5q-39xc-vjpf, build-time ReDoS via vite/tinyglobby) has no patched release yet;
        # gate on critical until one ships, then restore --audit-level=high.
        run: |
          npm audit --audit-level=critical

      - name: Production Bundle Build (Vite)
        run: |
          npm run build

      - name: Ephemeral CI Database Pre-Migration Bootstrap
        env:
          DATABASE_URL: postgresql://highflyer@localhost:5432/sahachara_ops_test_db
        run: |
          echo "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF; IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF; IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN BYPASSRLS; END IF; GRANT anon, authenticated, service_role TO highflyer; END \$\$;" | npx prisma db execute --stdin --url="$DATABASE_URL"

      - name: Deploy Prisma Migrations to CI Test Database
        env:
          DATABASE_URL: postgresql://highflyer@localhost:5432/sahachara_ops_test_db
        run: |
          npx prisma migrate deploy

      - name: Execute Core Verification Test Suites (12 Suites via npm test)
        env:
          TEST_DATABASE_URL: postgresql://highflyer@localhost:5432/sahachara_ops_test_db
        run: |
          npm test

      - name: Execute Security & Route Guard Suites (Standalone Suites)
        env:
          TEST_DATABASE_URL: postgresql://highflyer@localhost:5432/sahachara_ops_test_db
        run: |
          npm run test:auth-guard
          npm run test:api-security
          npm run test:data-elimination
          npm run test:rls
