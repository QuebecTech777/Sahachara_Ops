name: "Snyk Security Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  snyk-scan:
    name: Snyk Vulnerability Assessment
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Validate Snyk Secret Configuration
        id: check-auth
        env:
          SNYK_AUTH_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_AUTH_TOKEN" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::error::SNYK_TOKEN repository secret is missing. Snyk scan cannot proceed without authentication."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "SNYK_TOKEN secret is present."
          fi

      - name: Halt on Missing Snyk Credentials
        if: steps.check-auth.outputs.configured == 'false'
        run: |
          echo "=========================================================================="
          echo "ERROR: SNYK_TOKEN repository secret is not configured."
          echo ""
          echo "Snyk automated scanning requires an authenticated API token."
          echo "To configure:"
          echo "  1. Log into your Snyk dashboard at https://app.snyk.io"
          echo "  2. Go to Account Settings -> General -> API Token"
          echo "  3. In GitHub, navigate to: Settings -> Secrets and variables -> Actions"
          echo "  4. Add a new repository secret named: SNYK_TOKEN"
          echo "=========================================================================="
          exit 1

      - name: Install Pinned Snyk CLI
        if: steps.check-auth.outputs.configured == 'true'
        run: |
          npm install -g snyk@1.1308.4
          snyk --version

      - name: Install Project Dependencies (Strict Lockfile)
        if: steps.check-auth.outputs.configured == 'true'
        run: |
          npm ci --ignore-scripts

      - name: Snyk Open Source Dependency Scan (SCA)
        id: snyk-oss
        if: steps.check-auth.outputs.configured == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +e
          snyk test --all-projects --sarif-file-output=snyk-oss.sarif --severity-threshold=high
          OSS_EXIT=$?
          set -e
          echo "oss_code=$OSS_EXIT" >> $GITHUB_OUTPUT
          echo "Snyk Open Source scan finished with exit code: $OSS_EXIT"

      - name: Upload Snyk Open Source SARIF Results
        if: steps.check-auth.outputs.configured == 'true' && hashFiles('snyk-oss.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-oss.sarif
          category: snyk-open-source

      - name: Snyk Code Static Application Security Testing (SAST)
        id: snyk-code
        if: steps.check-auth.outputs.configured == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +e
          snyk code test --sarif-file-output=snyk-code.sarif --severity-threshold=high 2>&1 | tee snyk-code.log
          CODE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "code_code=$CODE_EXIT" >> $GITHUB_OUTPUT
          if grep -Fq 'SNYK-CODE-0005' snyk-code.log; then
            echo "code_disabled=true" >> $GITHUB_OUTPUT
          else
            echo "code_disabled=false" >> $GITHUB_OUTPUT
          fi
          echo "Snyk Code scan finished with exit code: $CODE_EXIT"

      - name: Upload Snyk Code SARIF Results
        if: steps.check-auth.outputs.configured == 'true' && hashFiles('snyk-code.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      - name: Classify & Enforce Snyk Scan Results
        if: steps.check-auth.outputs.configured == 'true'
        run: |
          OSS_CODE="${{ steps.snyk-oss.outputs.oss_code }}"
          CODE_CODE="${{ steps.snyk-code.outputs.code_code }}"
          CODE_DISABLED="${{ steps.snyk-code.outputs.code_disabled }}"

          SCAN_FAILURE=0
          OPERATIONAL_FAILURE=0

          echo "=========================================================================="
          echo "SAHACHARA OPS — SNYK SECURITY SCAN RESULT CLASSIFICATION"
          echo "=========================================================================="

          # Classify Snyk Open Source (SCA)
          case "$OSS_CODE" in
            0)
              echo "✓ Snyk Open Source: No high or critical dependencies vulnerabilities detected."
              ;;
            1)
              echo "::error::Snyk Open Source detected high or critical dependency vulnerabilities."
              SCAN_FAILURE=1
              ;;
            2)
              echo "::error::Snyk Open Source operational failure: Invalid CLI parameters or runtime failure."
              OPERATIONAL_FAILURE=1
              ;;
            3)
              echo "::error::Snyk Open Source configuration error: No supported project or manifest found."
              OPERATIONAL_FAILURE=1
              ;;
            *)
              echo "::error::Snyk Open Source service/auth error (exit code $OSS_CODE): Network failure, invalid token, or service outage."
              OPERATIONAL_FAILURE=1
              ;;
          esac

          # Classify Snyk Code (SAST)
          if [ "$CODE_DISABLED" = "true" ]; then
            echo "::warning::Snyk Code scan skipped: SNYK-CODE-0005 (Snyk Code is not enabled for this organization)."
          else
            case "$CODE_CODE" in
              0)
                echo "✓ Snyk Code: No high or critical static code defects detected."
                ;;
              1)
                echo "::error::Snyk Code detected high or critical application security vulnerabilities."
                SCAN_FAILURE=1
                ;;
              2)
                echo "::error::Snyk Code operational failure: Invalid CLI parameters or runtime failure."
                OPERATIONAL_FAILURE=1
                ;;
              3)
                echo "::error::Snyk Code configuration error: No supported code targets found."
                OPERATIONAL_FAILURE=1
                ;;
              *)
                echo "::error::Snyk Code service/auth error (exit code $CODE_CODE): Network failure, invalid token, or service outage."
                OPERATIONAL_FAILURE=1
                ;;
            esac
          fi

          echo "=========================================================================="
          if [ "$SCAN_FAILURE" -ne 0 ]; then
            echo "FAILED: Genuine high/critical security vulnerabilities detected."
            exit 1
          fi

          if [ "$OPERATIONAL_FAILURE" -ne 0 ]; then
            echo "FAILED: Operational, authentication, or network failure during scan execution."
            exit 1
          fi

          echo "SUCCESS: All available Snyk security scans passed with zero high/critical findings."
          echo "=========================================================================="
